<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <meta http-equiv="Pragma" content='no-cache'>
    <meta http-equiv="Expires" content="0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="d-flex">
        <div class="bg-dark text-white p-3" style="width:300px;min-height:100vh;position:sticky;top:0">
            <div class="d-flex justify-content-between">
                <h1>Projects</h1>
                 <button type="button" class="btn btn-primary rounded-circle shadow" data-bs-toggle="modal" data-bs-target="#addProjectModal"
                  style="width:45px; height:45px;background-color:green">
                 <i class="bi bi-plus-lg"></i>
                 </button>
            </div>
            <ul class="list-group" id='projectList'>
            </ul>
        </div>
        <div class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between">
                <h3>Tasks</h3>
                <div class="d-flex align-items-center gap-5">
                    <button type="button" class="btn btn-success " data-bs-toggle="modal"
                        data-bs-target="#addTaskModal">Add
                        Task</button>
                    <div class="dropdown">
                        <i class="fa fa-user-circle fa-2x dropdown-toggle" data-bs-toggle="dropdown" role="button"></i>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li class="userManagementMenu"><a class="dropdown-item" href="user.html">User Management</a></li>
                            <li class="userManagementMenu">
                                <hr class="dropdown-divider">
                                </hr>
                            </li>
                            <li><a class="dropdown-item" id="logoutBtn">Logout</a></li>
                    </div>
                </div>

            </div>
            <input type="hidden" id="project_id" name="project_id">
            <div id="taskList" class="mt-3"></div>
            <!-- Modal -->
            <div class="modal fade " id="addTaskModal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Task</h5>
                            <button class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form action="POST" id="addTask">
                                <input type="hidden" id="taskId">
                                <div class="mb-3 px-3">
                                    <label for="taskTitle">Title</label>
                                    <input type="text" id="taskTitle" class="form-control" name="taskTitle" />
                                    <div class="invalid-feedback ">Task is required</div>
                                </div>
                                <div class="mb-3 px-3">
                                    <label for="taskDescription">Description</label>
                                    <input type="text" id="taskDescription" class="form-control"
                                        name="taskDescription" />
                                    <div class="invalid-feedback">Description is required</div>
                                </div>
                                <div class="mb-3 px-3">
                                    <lable for="assignedTo">Assigned To</lable>
                                    <select class="form-select" id="assignedTo" name="assignedTo">
                                        <option value="">Select</option>
                                    </select>
                                    <div class="invalid-feedback">Assigned To is required</div>
                                </div>
                                <div class="mb-3 px-3">
                                    <label for="taskStatus">Status</label>
                                    <select id="taskStatus" class="form-select" name="taskStatus">
                                        <option value="">Select Status</option>
                                        <option value="pending">Pending</option>
                                        <option value="in_progress">In Progress</option>
                                        <option value="completed">Completed</option>
                                    </select>
                                    <div class="invalid-feedback">Status is required</div>
                                </div>
                                <div class="mb-3 px-3">
                                    <lable for="taskDueDate">Due Date</lable>
                                    <input type="date" class="form-control" id="taskDueDate" name="taskDueDate">
                                </div>
                                <div class="invalid-feedback">Due Date is required</div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary" form="addTask">Save</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="addProjectModal">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Project</h5>
                            <button class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form action="POST" id="addProjectForm">
                                <input type="hidden" id="projectId">
                                <div class="mb-3 px-3">
                                    <label for="projectName">Project Name</label>
                                    <input type="text" class="form-control" id="projectName" />
                                    <div class="invalid-feedback">Project Name is required</div>
                                </div>
                                <div class="mb-3 px-3">
                                    <label for="projectDesc">Description</label>
                                    <input type="text" class="form-control" id="projectDesc" />
                                    <div class="invalid-feedback">Description is required</div>
                                </div>
                            </form>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary" form="addProjectForm">Save</button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999;">
            <div class="toast align-items-center text-bg-success border-0" id="toast" role="alert">
                <div class="d-flex">
                    <div class="toast-body" id="toastMessage"></div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
</body>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</html>
