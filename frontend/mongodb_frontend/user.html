<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<style>
    table {
        table-layout: fixed;

    }
</style>

<body>
     <div class="position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div class="toast align-items-center text-bg-success border-0" id="toast" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
    <div class="d-flex justify-content-between p-4 align-items-center">
        <h3>Users</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal" data-s->Add User</button>
    </div>
   
    <div class="modal fade" id="addUserModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add User</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form action="POST" id="addUser">
                        <input type="hidden" id="userId">
                        <div class="mb-3 px-3">
                            <label for="userName">Name</label>
                            <input type="text" class="form-control" id="userName" name="userName">
                            <div class="invalid-feedback">Name is required</div>
                        </div>
                        <div class="mb-3 px-3">
                            <label for="userEmail">Email</label>
                            <input type="email" class="form-control" id="userEmail" name="userEmail">
                            <div class="invalid-feedback">Email is required</div>

                        </div>
                        <div class="mb-3 px-3">
                            <label for="userPassword">Password</label>
                            <input type="password" class="form-control" min="6" name="userPassword" id="userPassword">
                            <div class="invalid-feedback">Password is required</div>

                        </div>
                        <div class="mb-3 px-3">
                            <label for="userRole">Role</label>
                            <select class="form-select" id="userRole" name="userRole">
                                <option value="">Select Role</option>
                                <option value="manager">Manager</option>
                                <option value="admin">Admin</option>
                                <option value="employee">Employee</option>
                            </select>
                            <div class="invalid-feedback">Role is required</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" form="addUser">Save</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <hr>

    <div class="card p-3">
        <div class="d-flex justify-content-between mb-3">
            <input type="text" class="form-control" id="searchInput" placeholder="Search Users..">
            <button type="button" class="btn btn-primary ms-2">Search</button>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userDataTable">
                <!-- User Data listed Here -->
            </tbody>
        </table>
        <nav>
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
        
    </div>

</body>
<script src="js/api.js"></script>
<script src="js/user.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
