    <h1>Carousel</h1>
    <div id="carouselId" class="carousel slide bg-dark " data-bs-ride="carousel">
        <div class="carousel-inner text-white">
            <div class="carousel-item active">
                <!-- It will slide after 2s you need to include   data-bs-ride="carousel" then only it-->
                <div class="d-flex justify-content-center"><img src="https://picsum.photos/seed/picsum/200/200"
                        alt="" />
                </div>
                <div class="carousel-caption">
                    <h5>First Slide</h5>
                    <p>Some text of the person</p>
                </div>
            </div>
            <div class="carousel-item ">
                <div class="d-flex justify-content-center"><img src="https://picsum.photos/id/200/200/354?grayscale"
                        alt="" />
                </div>
                 <div class="carousel-caption">
                    <h5>Second Slide</h5>
                    <p>Some text of the person</p>
                </div>
            </div>
            <div class="carousel-item ">
                <div class="d-flex justify-content-center"><img src="https://picsum.photos/id/1060/200/200?blur=2"
                        alt="" />
                </div>
                  <div class="carousel-caption">
                    <h5>Third Slide</h5>
                    <p>Some text of the person</p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselId" data-bs-slide="prev"><span
                class="carousel-control-prev-icon"></span>
            <span class="visually-hidden">Previous</span></button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselId" data-bs-slide="next"><span
                class="carousel-control-next-icon"></span>
            <span class="visually-hidden">Next</span></button>
    </div>

    <script src="https://github.com/twbs/bootstrap/blob/v5.3.8/site/src/assets/partials/snippets.js"></script>
    <script>
        const toastTrigger = document.getElementById('liveToastBtn')
        const toastLiveExample = document.getElementById('liveToast')

        if (toastTrigger) {
            const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastLiveExample)
            toastTrigger.addEventListener('click', () => {
                toastBootstrap.show()
            })
        }
    </script>
